<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bếp Mama Việt</title>
<style>
:root{--pink:#ff6f91;--pink-d:#d94a70;--brown:#6b3e26;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--brown);
  background:#ffeaf1 repeating-conic-gradient(#ffd6e3 0 25%,#ffeaf1 0 50%) 0 0/48px 48px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:min(100vw,133.333vh);height:min(75vw,100vh);container-type:size;border-radius:1.5cqw;overflow:hidden;box-shadow:0 1cqw 4cqw rgba(160,60,90,.3)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;padding:2cqw;font-size:2.4cqw;background:rgba(255,240,245,.82);backdrop-filter:blur(2px)}
.overlay.show{display:flex}
#menu{background:radial-gradient(circle at 50% 30%,#fff8fb 0,#ffe0ea 70%)}
h1{margin:0;font-size:7.5cqw;color:#ff4d79;font-weight:900;letter-spacing:.1cqw;text-shadow:0 .5cqw 0 #fff,0 .9cqw 0 #ffb3c8}
h2{margin:0;font-weight:900}
.sub{margin:.6cqw 0 0;font-size:2.6cqw;font-weight:700}
.row{display:flex;align-items:center;justify-content:center;gap:2cqw}
#mamaMenu{width:24cqw;height:24cqw}
#mamaIntro,#mamaResult{width:25cqw;height:25cqw}
.cards{display:flex;gap:2cqw}
.card{width:26cqw;background:#fff;border:.4cqw solid #ffc2d4;border-radius:2.4cqw;padding:1.2cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;cursor:pointer;font-family:inherit;color:var(--brown);box-shadow:0 .6cqw 0 #ffc2d4;transition:transform .12s}
.card:hover{transform:translateY(-.6cqw) rotate(-1deg)}
.card canvas{width:100%;height:auto}
.card b{font-size:3cqw;font-weight:900;color:var(--pink-d)}
.card small{font-size:1.7cqw}
.card .best{font-size:1.8cqw;font-weight:800;background:#fff3c4;border-radius:99px;padding:.2cqw 1.2cqw}
.btn{background:var(--pink);color:#fff;border:none;border-radius:99px;padding:1.2cqw 4cqw;font:900 2.8cqw/1.2 inherit;font-family:inherit;cursor:pointer;box-shadow:0 .6cqw 0 var(--pink-d);transition:transform .1s}
.btn:active{transform:translateY(.4cqw);box-shadow:0 .2cqw 0 var(--pink-d)}
.btn.alt{background:#5fb0f5;box-shadow:0 .6cqw 0 #3b86c9}
#muteBtn{position:absolute;right:1.5cqw;top:1.6cqw;width:5.5cqw;height:5.5cqw;border-radius:50%;border:.3cqw solid #ffb3c8;background:#fff;font-size:2.8cqw;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;padding:0}
.bubble{position:relative;background:#fff;border:.5cqw solid #ffc2d4;border-radius:3cqw;padding:2.2cqw 3cqw;max-width:52cqw;text-align:left}
.bubble::before{content:"";position:absolute;left:-2.6cqw;top:40%;border:1.3cqw solid transparent;border-right:1.6cqw solid #ffc2d4}
.bubble .stepno{color:var(--pink-d);font-weight:800;font-size:2cqw}
.bubble h2{font-size:4.8cqw;color:#ff4d79}
.bubble p{margin:.8cqw 0 0;font-size:2.5cqw;font-weight:600;line-height:1.35}
#rateText{font-size:7cqw;color:#ff4d79;text-shadow:0 .4cqw 0 #fff}
#rateMsg{margin:0;font-size:3cqw;font-weight:800}
#rateScore{font-size:3.6cqw;font-weight:900}
#rateScore .stars{color:#ffb800;letter-spacing:.3cqw;font-size:4.6cqw}
#final h2{font-size:4.4cqw;color:#ff4d79}
#dishCv{width:50cqw;height:auto}
#finalMedal{font-size:3.8cqw;font-weight:900}
#finalScore{font-size:2.6cqw;font-weight:800}
#stepScores{display:flex;flex-wrap:wrap;gap:.6cqw;justify-content:center;max-width:80cqw;font-size:1.8cqw}
#stepScores span{background:#fff;border-radius:99px;padding:.3cqw 1.2cqw;border:.25cqw solid #ffd0dd}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="muteBtn" title="Bật/tắt âm thanh">🔊</button>

  <div id="menu" class="overlay show">
    <div class="row">
      <canvas id="mamaMenu" width="300" height="300"></canvas>
      <div><h1>Bếp Mama Việt</h1><p class="sub">Vào bếp nấu món Việt cùng Mama nào! 🍲</p></div>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <div id="intro" class="overlay">
    <div class="row">
      <canvas id="mamaIntro" width="300" height="300"></canvas>
      <div class="bubble"><div class="stepno" id="introStep"></div><h2 id="introTitle"></h2><p id="introHint"></p></div>
    </div>
    <button class="btn" id="startBtn">Bắt đầu!</button>
  </div>

  <div id="result" class="overlay">
    <canvas id="mamaResult" width="300" height="300"></canvas>
    <h2 id="rateText"></h2>
    <p id="rateMsg"></p>
    <div id="rateScore"></div>
    <button class="btn" id="nextBtn">Tiếp tục ➜</button>
  </div>

  <div id="final" class="overlay">
    <h2>Hoàn thành món <span id="finalName"></span>!</h2>
    <canvas id="dishCv" width="600" height="330"></canvas>
    <div id="finalMedal"></div>
    <div id="finalScore"></div>
    <div id="stepScores"></div>
    <div class="row"><button class="btn" id="againBtn">Nấu lại</button><button class="btn alt" id="menuBtn">Về menu</button></div>
  </div>
</div>

<script>
'use strict';
// ================= Cơ bản =================
const W = 800, H = 600;
const FONT = '"Segoe UI",Tahoma,Arial,sans-serif';
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let SC = 1, T = 0;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = a => a[Math.floor(Math.random() * a.length)];
const sr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  SC = cv.width / W;
}
new ResizeObserver(resize).observe($('stage'));
resize();

// ================= Vẽ tiện ích =================
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function txt(c, s, x, y, size, color = '#6b3e26', align = 'center', weight = '800') {
  c.font = `${weight} ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = color; c.fillText(s, x, y);
}
function outlineTxt(c, s, x, y, size, fill, stroke = '#fff') {
  c.font = `900 ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = size / 4.5; c.strokeStyle = stroke; c.strokeText(s, x, y);
  c.fillStyle = fill; c.fillText(s, x, y);
}
function emoji(c, e, x, y, size) { c.font = `${size}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(e, x, y); }
function star(c, x, y, r1, r2, n, rot) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  c.closePath();
}
function blob(c, pts) {
  const n = pts.length, mid = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  c.beginPath(); const m0 = mid(0); c.moveTo(m0[0], m0[1]);
  for (let i = 1; i <= n; i++) { const p = pts[i % n], m = mid(i); c.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
  c.closePath();
}
function drawArrow(c, x, y, dir, len) {
  const ang = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[dir];
  const off = ((T * 1.4) % 1) * 50;
  c.save(); c.translate(x, y); c.rotate(ang); c.translate(off - 25, 0);
  c.globalAlpha = 0.9;
  c.beginPath(); c.moveTo(-len / 2, -14); c.lineTo(len / 2 - 30, -14); c.lineTo(len / 2 - 30, -34); c.lineTo(len / 2 + 10, 0);
  c.lineTo(len / 2 - 30, 34); c.lineTo(len / 2 - 30, 14); c.lineTo(-len / 2, 14); c.closePath();
  c.fillStyle = '#ff6f91'; c.strokeStyle = '#fff'; c.lineWidth = 6; c.lineJoin = 'round'; c.stroke(); c.fill();
  c.restore();
}
// Màu chín: 0 sống → 1 vàng đẹp → 1.6 cháy
const CK = [[0, [248, 236, 210]], [1, [226, 160, 52]], [1.6, [110, 55, 18]], [2.2, [35, 22, 12]]];
function cookColor(v) {
  v = clamp(v, 0, 2.2);
  for (let i = 0; i < CK.length - 1; i++) {
    const [a, ca] = CK[i], [b, cb] = CK[i + 1];
    if (v <= b) { const t = (v - a) / (b - a); return `rgb(${ca.map((x, j) => Math.round(lerp(x, cb[j], t))).join(',')})`; }
  }
  return 'rgb(35,22,12)';
}
function drawCookGauge(c, v, x, y, w, h = 24, labels = true) {
  const g = c.createLinearGradient(x, 0, x + w, 0);
  [0, 0.3, 0.625, 0.8, 1].forEach(s => g.addColorStop(s, cookColor(s * 1.6)));
  c.fillStyle = '#fff'; rrect(c, x - 5, y - 5, w + 10, h + 10, (h + 10) / 2); c.fill();
  c.fillStyle = g; rrect(c, x, y, w, h, h / 2); c.fill();
  const zx = x + w * 0.88 / 1.6, zw = w * 0.24 / 1.6;
  c.strokeStyle = '#2ecc71'; c.lineWidth = h > 15 ? 4 : 3; rrect(c, zx, y - 3, zw, h + 6, 5); c.stroke();
  const px = x + w * clamp(v / 1.6, 0, 1);
  c.fillStyle = '#d94a70'; c.beginPath(); c.moveTo(px - 9, y - 14); c.lineTo(px + 9, y - 14); c.lineTo(px, y - 2); c.fill();
  c.fillRect(px - 2, y, 4, h);
  if (labels) { txt(c, 'Sống', x - 12, y + h / 2, 15, '#7a5a48', 'right'); txt(c, 'Cháy', x + w + 12, y + h / 2, 15, '#7a5a48', 'left'); }
}

// ================= Âm thanh =================
const Sfx = {
  ac: null, muted: false, sz: null, nb: null,
  init() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  noiseBuf() {
    if (!this.nb) { const a = this.ac, b = a.createBuffer(1, a.sampleRate, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nb = b; }
    return this.nb;
  },
  tone(f, d = 0.12, type = 'sine', v = 0.2, slide = 0) {
    if (this.muted || !this.ac) return;
    const a = this.ac, o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.08, v = 0.3, freq = 2000) {
    if (this.muted || !this.ac) return;
    const a = this.ac, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = this.noiseBuf(); f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d + 0.02);
  },
  chop() { this.noise(0.07, 0.5, 1600); this.tone(160, 0.06, 'square', 0.05); },
  pop() { this.tone(500, 0.09, 'sine', 0.22, 2); },
  good() { this.tone(880, 0.1, 'sine', 0.2); setTimeout(() => this.tone(1320, 0.16, 'sine', 0.2), 80); },
  bad() { this.tone(220, 0.3, 'sawtooth', 0.1, 0.5); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.22, 'triangle', 0.18), i * 130)); },
  sizzleStart() {
    if (this.muted || !this.ac || this.sz) return;
    const a = this.ac, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = this.noiseBuf(); s.loop = true; f.type = 'highpass'; f.frequency.value = 3500; g.gain.value = 0.05;
    s.connect(f).connect(g).connect(a.destination); s.start(); this.sz = s;
  },
  sizzleStop() { if (this.sz) { try { this.sz.stop(); } catch (e) { } this.sz = null; } },
};

// ================= Hiệu ứng =================
let pops = [], parts = [];
function addPop(text, x, y, color = '#ff4d79') { pops.push({ text, x, y, t: 0, color }); }
function addParts(x, y, color, n = 10, spd = 160) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rand(0.4, 0.9), t: 0, color, r: rand(3, 7) }); }
}
function updFx(dt) {
  pops.forEach(p => p.t += dt); pops = pops.filter(p => p.t < 1);
  parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }); parts = parts.filter(p => p.t < p.life);
}
function drawFx(c) {
  parts.forEach(p => { c.globalAlpha = clamp(1 - p.t / p.life, 0, 1); c.fillStyle = p.color; circ(c, p.x, p.y, p.r); c.fill(); });
  c.globalAlpha = 1;
  pops.forEach(p => { c.globalAlpha = clamp(1.4 - p.t * 1.4, 0, 1); outlineTxt(c, p.text, p.x, p.y - p.t * 50, 30, p.color); });
  c.globalAlpha = 1;
}

// ================= Nhập liệu (chuột + cảm ứng) =================
const pointer = { down: false, x: W / 2, y: H / 2 };
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return; e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  Sfx.init();
  const p = toLocal(e); pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  if (state === 'play' && cur.down) cur.down(p);
});
cv.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  const p = toLocal(e); pointer.x = p.x; pointer.y = p.y;
  if (state === 'play' && cur.move) cur.move(p);
});
function onUp(e) {
  if (!e.isPrimary || !pointer.down) return;
  const p = toLocal(e); pointer.down = false;
  if (state === 'play' && cur.up) cur.up(p);
}
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);

// ================= Bối cảnh =================
function drawKitchen(c) {
  c.fillStyle = '#fff3e3'; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#f6dcc0'; c.lineWidth = 2;
  for (let x = 0; x <= W; x += 50) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 440); c.stroke(); }
  for (let y = 0; y <= 440; y += 50) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.fillStyle = '#e7b07a'; c.fillRect(0, 440, W, 160);
  c.fillStyle = '#cf915a'; c.fillRect(0, 440, W, 12);
  c.strokeStyle = 'rgba(150,90,40,.22)'; c.lineWidth = 3;
  for (let y = 475; y < H; y += 30) { c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(200, y + 7, 500, y - 7, W, y + 3); c.stroke(); }
}
function drawBoard(c, x, y, w, h) {
  c.fillStyle = 'rgba(0,0,0,.13)'; rrect(c, x + 6, y + 10, w, h, 26); c.fill();
  c.fillStyle = '#e9c28f'; rrect(c, x, y, w, h, 26); c.fill();
  c.strokeStyle = '#c08a52'; c.lineWidth = 6; c.stroke();
  c.strokeStyle = 'rgba(170,110,50,.25)'; c.lineWidth = 2;
  for (let i = 1; i < 6; i++) { const yy = y + h * i / 6; c.beginPath(); c.moveTo(x + 20, yy); c.bezierCurveTo(x + w * 0.3, yy + 6, x + w * 0.7, yy - 6, x + w - 20, yy); c.stroke(); }
}
function drawStove(c, cx, top, heat) {
  if (heat > 0.02) {
    for (let i = 0; i < 9; i++) {
      const fx = cx - 120 + i * 30, h = (18 + heat * 60) * (0.8 + 0.25 * Math.sin(T * 20 + i * 1.7));
      c.fillStyle = 'rgba(70,130,255,.9)';
      c.beginPath(); c.moveTo(fx - 11, top); c.quadraticCurveTo(fx - 7, top - h * 0.6, fx, top - h); c.quadraticCurveTo(fx + 7, top - h * 0.6, fx + 11, top); c.fill();
      c.fillStyle = 'rgba(190,230,255,.9)';
      c.beginPath(); c.moveTo(fx - 5, top); c.quadraticCurveTo(fx - 3, top - h * 0.35, fx, top - h * 0.55); c.quadraticCurveTo(fx + 3, top - h * 0.35, fx + 5, top); c.fill();
    }
  }
  c.fillStyle = '#3a3a3a'; rrect(c, cx - 210, top, 420, 100, 16); c.fill();
  c.fillStyle = '#555'; rrect(c, cx - 210, top, 420, 16, 8); c.fill();
  [-140, 140].forEach(k => { c.fillStyle = '#ddd'; circ(c, cx + k, top + 58, 18); c.fill(); c.fillStyle = '#999'; c.fillRect(cx + k - 3, top + 42, 6, 16); });
}

// ================= Mama =================
function drawMama(c, x, y, s, mood) {
  c.save(); c.translate(x, y); c.scale(s, s); c.translate(0, Math.sin(T * 3) * 3);
  if (mood === 'angry') {
    for (let i = 0; i < 12; i++) {
      const h = 40 + 15 * Math.sin(T * 15 + i * 2);
      c.save(); c.rotate(i / 12 * Math.PI * 2); c.fillStyle = i % 2 ? '#ff5a1f' : '#ffb21f';
      c.beginPath(); c.moveTo(-28, -88); c.quadraticCurveTo(-10, -88 - h * 0.6, 0, -92 - h); c.quadraticCurveTo(10, -88 - h * 0.6, 28, -88); c.closePath(); c.fill();
      c.restore();
    }
  }
  // thân
  c.fillStyle = '#ff6f91'; rrect(c, -85, 75, 170, 130, 60); c.fill();
  c.fillStyle = '#fff'; rrect(c, -52, 98, 104, 110, 24); c.fill();
  c.fillStyle = '#ff6f91'; circ(c, 0, 140, 7); c.fill();
  c.fillStyle = '#ffd2ad'; c.fillRect(-18, 60, 36, 24);
  // tóc + mặt
  c.fillStyle = '#4a2c1a'; ell(c, 0, 0, 96, 98); c.fill();
  c.fillStyle = '#ffdcbc'; ell(c, 0, 12, 80, 78); c.fill();
  c.fillStyle = '#4a2c1a'; ell(c, -36, -30, 46, 22, -0.3); c.fill(); ell(c, 36, -30, 46, 22, 0.3); c.fill();
  // khăn
  c.fillStyle = '#e63946'; c.beginPath(); c.ellipse(0, -30, 100, 78, 0, 0, Math.PI, true); c.quadraticCurveTo(0, -62, 100, -30); c.closePath(); c.fill();
  c.fillStyle = '#fff';[[-60, -60], [-22, -84], [24, -82], [62, -58], [0, -60], [-80, -42], [82, -40]].forEach(([a, b]) => { circ(c, a, b, 6); c.fill(); });
  c.fillStyle = '#e63946'; ell(c, 104, -46, 22, 12, -0.6); c.fill(); ell(c, 108, -24, 20, 11, 0.5); c.fill(); circ(c, 96, -36, 10); c.fill();
  // mắt
  c.lineCap = 'round';
  if (mood === 'happy') {

function mkSliceBeef() {
  const mx = 170, my = 230, mw = 460, mh = 190, n = 5;
  const lines = []; for (let i = 1; i <= n; i++) lines.push({ x: mx + mw * i / (n + 1), cut: false, cx: 0, acc: 0 });
  const marb = []; for (let i = 0; i < 10; i++) marb.push({ x: mx + rand(20, mw - 60), y: my + rand(20, mh - 20), w: rand(40, 110), a: rand(-0.5, 0.5) });
  let stroke = null, spread = 0;
  function meat(c) {
    c.fillStyle = '#c94545'; rrect(c, mx, my, mw, mh, 40); c.fill();
    c.strokeStyle = 'rgba(255,240,240,.75)'; c.lineCap = 'round';
    marb.forEach(m => { c.lineWidth = 4; c.beginPath(); c.moveTo(m.x, m.y); c.quadraticCurveTo(m.x + m.w / 2, m.y + m.w * m.a, m.x + m.w, m.y + 6); c.stroke(); });
    c.fillStyle = 'rgba(255,255,255,.15)'; rrect(c, mx + 20, my + 12, mw - 40, 26, 13); c.fill();
    c.strokeStyle = '#9e2f2f'; c.lineWidth = 5; rrect(c, mx, my, mw, mh, 40); c.stroke();
  }
  return {
    time: 15, done: false,
    down(p) { stroke = [p]; },
    move(p) { if (stroke && pointer.down) stroke.push(p); },
    up() {
      if (!stroke) return; const s = stroke; stroke = null;
      const ys = s.map(q => q.y), y0 = Math.min(...ys), y1 = Math.max(...ys);
      if (y1 - y0 < mh * 0.55 || y0 > my + mh * 0.35 || y1 < my + mh * 0.65) { if (y1 - y0 > 20) addPop('Vuốt dài hơn!', s[0].x, s[0].y, '#e67e22'); return; }
      const ax = s.reduce((a, q) => a + q.x, 0) / s.length;
      let best = null, bd = 1e9;
      for (const l of lines) if (!l.cut) { const d = Math.abs(l.x - ax); if (d < bd) { bd = d; best = l; } }
      if (!best || bd > 80) return;
      best.cut = true; best.cx = ax; best.acc = clamp(1 - bd / 40, 0, 1); Sfx.chop();
      addPop(best.acc > 0.8 ? 'Đẹp lắm!' : best.acc > 0.45 ? 'Được!' : 'Lệch rồi!', ax, my - 28, best.acc > 0.8 ? '#ff4d79' : best.acc > 0.45 ? '#f39c12' : '#888');
      addParts(ax, my + mh / 2, '#e57373', 6);
      if (lines.every(l => l.cut)) this.done = true;
    },
    update(dt) { if (this.done) spread = Math.min(1, spread + dt * 3); },
    draw(c) {
      drawBoard(c, 110, 170, 580, 320);
      const edges = [mx, ...lines.filter(l => l.cut).map(l => l.cx).sort((a, b) => a - b), mx + mw];
      for (let i = 0; i < edges.length - 1; i++) {
        c.save(); c.translate((i - (edges.length - 2) / 2) * 14 * spread, 0);
        c.beginPath(); c.rect(edges[i] + 1.5, my - 10, edges[i + 1] - edges[i] - 3, mh + 20); c.clip(); meat(c); c.restore();
      }
      c.setLineDash([12, 10]); c.strokeStyle = '#fff59d'; c.lineWidth = 4;
      lines.forEach(l => { if (!l.cut) { c.beginPath(); c.moveTo(l.x, my - 22); c.lineTo(l.x, my + mh + 22); c.stroke(); } });
      c.setLineDash([]);
      if (stroke && stroke.length > 1) { c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); stroke.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke(); }
      if (pointer.down && state === 'play') emoji(c, '🔪', pointer.x + 18, pointer.y - 18, 50);
    },
    score() { return lines.reduce((a, l) => a + l.acc, 0) / n * 100; },
  };
}

    },

      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; bub.forEach(b => { circ(c, b.x, b.y, b.r); c.stroke(); });
      c.restore();
      steam.forEach(s => { c.fillStyle = `rgba(200,200,205,${(1 - s.t / 2) * 0.5})`; circ(c, s.x + Math.sin(s.t * 3 + s.x) * 10, s.y, 14 + s.t * 12); c.fill(); });
      // thước nhiệt

      const gg = c.createLinearGradient(0, gy + gh, 0, gy); gg.addColorStop(0, '#9fd3ff'); gg.addColorStop(1, '#ff8a80');

    time: 20, done: false,

  if (state === 'ending') outlineTxt(ctx, cur.done ? 'Xong rồi!' : 'Hết giờ!', W / 2, H / 2, 72, cur.done ? '#ff4d79' : '#e67e22');
  if (state === 'menu') drawMamaCanvas('mamaMenu', 'happy');
  else if (state === 'intro') drawMamaCanvas('mamaIntro', 'normal');
  else if (state === 'result') drawMamaCanvas('mamaResult', resultMood);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (state === 'ready') { readyT -= dt; if (readyT <= 0) { state = 'play'; Sfx.tone(880, 0.15, 'triangle', 0.18); } }
  else if (state === 'play') {
    timeLeft -= dt; cur.update(dt);
    if (cur.done || timeLeft <= 0) { state = 'ending'; endT = cur.done ? 0.9 : 1.1; pointer.down = false; if (!cur.done) Sfx.bad(); }
  } else if (state === 'ending') { cur.update(dt); endT -= dt; if (endT <= 0) finishStep(); }
  else if (state === 'final' && Math.random() < 0.4) addParts(rand(0, W), -10, rnd(['#ff6f91', '#ffd23f', '#5fb0f5', '#7cc576']), 1, 80);
  updFx(dt);
  render();
  requestAnimationFrame(loop);
}
buildMenu();
requestAnimationFrame(loop);
</script>
</body>
